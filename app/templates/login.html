<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion / Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container" style="max-width: 400px;">
        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-4">Smart Fridge</h3>
            <div id="error-msg" class="alert alert-danger d-none"></div>
            
            <form id="auth-form">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="button" onclick="submitAuth('/auth/login')" class="btn btn-primary">Se connecter</button>
                    <button type="button" onclick="submitAuth('/auth/register')" class="btn btn-outline-secondary">S'inscrire</button>
                </div>
            </form>
        </div>
    </div>

    <script>
    async function submitAuth(url) {
        const emailInput = document.getElementById('email').value.trim();
        const passwordInput = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('error-msg');
        errorDiv.classList.add('d-none');

        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ 
                    email: emailInput, 
                    password: passwordInput 
                })
            });

            const data = await res.json();

            if (!res.ok) {
                let message = "Une erreur est survenue";
                if (typeof data.detail === 'string') {
                    message = data.detail;
                } else if (Array.isArray(data.detail)) {
                    message = data.detail.map(err => `${err.loc.join('.')}: ${err.msg}`).join(', ');
                }
                throw new Error(message);
            }

            document.cookie = `access_token=${data.access_token}; path=/; max-age=86400`;
            localStorage.setItem('access_token', data.access_token);
            window.location.href = '/';

        } catch (err) {
            errorDiv.textContent = err.message;
            errorDiv.classList.remove('d-none');
        }
    }
    </script>
</body>
</html>
