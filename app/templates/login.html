<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fridge — Connexion</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="dashboard-card shadow-sm">
            <h2 class="auth-title">Smart Fridge</h2>
            
            <div id="error-msg" class="auth-error hidden"></div>
            
            <form id="auth-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="nom@exemple.com">
                </div>

                <div class="field">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <div class="auth-buttons">
                    <button type="button" onclick="submitAuth('/auth/login')" class="btn-primary">Se connecter</button>
                    <button type="button" onclick="submitAuth('/auth/register')" class="btn-secondary">S'inscrire</button>
                </div>
            </form>
        </div>
    </div>

    <script>
    async function submitAuth(url) {
        const emailInput = document.getElementById('email').value.trim();
        const passwordInput = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('error-msg');
        
        errorDiv.classList.add('hidden');

        if (!emailInput || !passwordInput) {
            errorDiv.textContent = "Veuillez remplir tous les champs.";
            errorDiv.classList.remove('hidden');
            return;
        }

        const formData = new URLSearchParams();
        formData.append('username', emailInput);
        formData.append('password', passwordInput);
        
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            });

            const data = await res.json();

            if (!res.ok) {
                let message = "Une erreur est survenue";
                if (typeof data.detail === 'string') {
                    message = data.detail;
                } else if (Array.isArray(data.detail)) {
                    message = "Veuillez saisir des identifiants valides.";
                }
                throw new Error(message);
            }

            document.cookie = `access_token=Bearer ${data.access_token}; path=/; max-age=86400; SameSite=Lax`;
            localStorage.setItem('access_token', data.access_token);
            
            window.location.href = '/';

        } catch (err) {
            errorDiv.textContent = err.message;
            errorDiv.classList.remove('hidden');
        }
    }
    </script>
</body>
</html>
